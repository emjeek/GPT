name: Build GPTWake APK

on:
  push:
    branches:
      - build/gptwake-hey-chatgpt
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v4

      - name: Checkout GPTWake source
        uses: actions/checkout@v4
        with:
          repository: suddenBook/GPTWake
          ref: main
          path: GPTWake

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build debug APK
        working-directory: GPTWake
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: cp GPTWake/app/build/outputs/apk/debug/app-debug.apk GPTWake-Hey-ChatGPT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPTWake-Hey-ChatGPT
          path: GPTWake-Hey-ChatGPT.apk
          if-no-files-found: error
          retention-days: 7
