name: Build ChatGPT Voice Bridge v3

on:
  push:
    branches:
      - build/chatgpt-voice-bridge-v3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: voicebridge
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp voicebridge/app/build/outputs/apk/debug/app-debug.apk ChatGPT-Voice-Bridge-v3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Voice-Bridge-v3
          path: ChatGPT-Voice-Bridge-v3.apk
          retention-days: 7
