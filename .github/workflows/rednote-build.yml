name: RedNote Android Build

on:
  pull_request:
    branches: [rednote-ci-base-20260821]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rehydrate and patch RedNote source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rednote
          cat ci/rednote-source.part-* | base64 -d > /tmp/rednote-source.tar.gz
          tar -xzf /tmp/rednote-source.tar.gz -C rednote
          sed -i '/org.jetbrains.kotlin.android/d' rednote/build.gradle.kts rednote/app/build.gradle.kts
          sed -i 's/compileSdk = 36/compileSdk = 37/' rednote/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          root = Path('rednote')

          p = root / 'app/src/main/java/com/personal/rednote/audio/RecordingService.kt'
          s = p.read_text()
          if 'import android.os.Build\n' not in s:
              s = s.replace('import android.os.IBinder\n', 'import android.os.Build\nimport android.os.IBinder\n')
          s = s.replace('while (isActive && recorder != null) {', 'while (kotlin.coroutines.coroutineContext.isActive && recorder != null) {')
          s = s.replace('                selected?.let { setPreferredDevice(it) }', '                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n                    selected?.let { setPreferredDevice(it) }\n                }')
          s = s.replace('            val routed = recorder?.routedDevice', '            val routed = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) recorder?.routedDevice else selected')
          s = s.replace('            val routedName = graph.audioDevices.label(runCatching { current.routedDevice }.getOrNull())', '            val routedName = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n                graph.audioDevices.label(runCatching { current.routedDevice }.getOrNull())\n            } else {\n                chosenDeviceName.orEmpty()\n            }')
          p.write_text(s)

          p = root / 'app/src/main/java/com/personal/rednote/audio/MediaChunker.kt'
          s = p.read_text()
          s = s.replace('                info.flags = extractor.sampleFlags\n', '''                val sampleFlags = extractor.sampleFlags\n                info.flags = if (sampleFlags and MediaExtractor.SAMPLE_FLAG_SYNC != 0) {\n                    android.media.MediaCodec.BUFFER_FLAG_KEY_FRAME\n                } else {\n                    0\n                }\n''')
          p.write_text(s)

          p = root / 'app/src/main/java/com/personal/rednote/ui/Components.kt'
          s = p.read_text()
          if 'import androidx.compose.material.icons.rounded.Settings\n' not in s:
              s = s.replace('import androidx.compose.material.icons.rounded.Mic\n', 'import androidx.compose.material.icons.rounded.Mic\nimport androidx.compose.material.icons.rounded.Settings\nimport androidx.compose.material.icons.rounded.Description\n')
          p.write_text(s)

          p = root / 'app/src/main/java/com/personal/rednote/ui/TranscriptScreen.kt'
          s = p.read_text()
          if 'import androidx.compose.foundation.clickable\n' not in s:
              s = s.replace('import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.clickable\n')
          p.write_text(s)
          PY

          cat ci/rednote-cleanup-patch.part-* | base64 -d > /tmp/rednote-cleanup-patch.tar.gz
          tar -xzf /tmp/rednote-cleanup-patch.tar.gz -C rednote
          base64 -d ci/rednote-legacy-hotfix.b64 > /tmp/rednote-legacy-hotfix.tar.gz
          tar -xzf /tmp/rednote-legacy-hotfix.tar.gz -C rednote

      - name: Generate Gradle wrapper
        working-directory: rednote
        run: gradle wrapper --gradle-version 9.5.0

      - name: Unit tests, lint, and APK builds
        working-directory: rednote
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- lint text reports ---'
            find app/build -name 'lint-results-debug.txt' -type f -print -exec cat {} \; 2>/dev/null || true
          fi
          exit "$status"

      - name: Collect artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rednote/ci-output
          cp rednote/app/build/outputs/apk/debug/app-debug.apk rednote/ci-output/RedNote-v1.1-debug.apk
          if [ -f rednote/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp rednote/app/build/outputs/apk/release/app-release-unsigned.apk rednote/ci-output/RedNote-v1.1-release-unsigned.apk
          fi
          rm -rf rednote/.gradle rednote/app/build
          (cd rednote && zip -qr ci-output/RedNote-v1.1-source.zip . -x 'ci-output/*')
          sha256sum rednote/ci-output/* > rednote/ci-output/SHA256SUMS-v1.1.txt

      - name: Upload RedNote build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RedNote-v1.1-build
          path: rednote/ci-output/*
          if-no-files-found: error
          retention-days: 14
