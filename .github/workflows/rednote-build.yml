name: RedNote Android Build

on:
  pull_request:
    branches: [rednote-ci-base-20260821]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rehydrate RedNote source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rednote
          cat ci/rednote-source.part-* | base64 -d > /tmp/rednote-source.tar.gz
          tar -xzf /tmp/rednote-source.tar.gz -C rednote
          sed -i '/org.jetbrains.kotlin.android/d' rednote/build.gradle.kts rednote/app/build.gradle.kts

      - name: Generate Gradle wrapper
        working-directory: rednote
        run: gradle wrapper --gradle-version 9.5.0

      - name: Unit tests, lint, and APK builds
        working-directory: rednote
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Collect artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rednote/ci-output
          cp rednote/app/build/outputs/apk/debug/app-debug.apk rednote/ci-output/RedNote-debug.apk
          if [ -f rednote/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp rednote/app/build/outputs/apk/release/app-release-unsigned.apk rednote/ci-output/RedNote-release-unsigned.apk
          fi
          rm -rf rednote/.gradle rednote/app/build
          (cd rednote && zip -qr ci-output/RedNote-source.zip . -x 'ci-output/*')
          sha256sum rednote/ci-output/* > rednote/ci-output/SHA256SUMS.txt

      - name: Upload RedNote build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RedNote-build
          path: rednote/ci-output/*
          if-no-files-found: error
          retention-days: 14
